<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" content="#000000">
    <title>FitTrack - Your Personal Nutrition Coach</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: #f5f5f7;
            min-height: 100vh;
            overscroll-behavior: none;
        }
        input, select, textarea, button { font-family: inherit; }
        input:focus, select:focus { outline: none; }
        button { cursor: pointer; transition: all 0.2s; }
        button:active { transform: scale(0.95); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        .slide-up { animation: slideUp 0.4s ease-out; }
        .slide-in { animation: slideIn 0.3s ease-out; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        .pulse { animation: pulse 2s infinite; }
        .shimmer { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        ::-webkit-scrollbar { display: none; }
        .card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .btn-primary { background: #000; color: white; border: none; padding: 16px; border-radius: 14px; font-weight: 600; font-size: 15px; width: 100%; }
        .btn-secondary { background: #f5f5f7; color: #000; border: 1px solid #e5e5e7; padding: 14px; border-radius: 14px; font-weight: 600; font-size: 14px; width: 100%; }
        .input-field { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #e5e5e7; font-size: 15px; background: white; }
        .input-field:focus { border-color: #000; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            const [screen, setScreen] = useState('login');
            const [tab, setTab] = useState('home');
            const [user, setUser] = useState(null);
            const [profile, setProfile] = useState(null);
            const [entries, setEntries] = useState([]);
            const [workouts, setWorkouts] = useState([]);
            const [water, setWater] = useState(0);
            const [steps, setSteps] = useState(0);
            const [weight, setWeight] = useState([]);
            const [currentTime, setCurrentTime] = useState(new Date());
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [showAddFood, setShowAddFood] = useState(false);
            const [analyzing, setAnalyzing] = useState(false);
            const [notification, setNotification] = useState('');

            // Setup form
            const [setupAge, setSetupAge] = useState('');
            const [setupWeight, setSetupWeight] = useState('');
            const [setupHeight, setSetupHeight] = useState('');
            const [setupGoal, setSetupGoal] = useState('');
            const [setupGoalType, setSetupGoalType] = useState('leaner');
            const [setupGender, setSetupGender] = useState('male');
            const [setupActivity, setSetupActivity] = useState('moderate');
            const [setupName, setSetupName] = useState('');
            const [setupStep, setSetupStep] = useState(0);

            // Food entry
            const [foodName, setFoodName] = useState('');
            const [foodCal, setFoodCal] = useState('');
            const [foodProtein, setFoodProtein] = useState('');
            const [foodCarbs, setFoodCarbs] = useState('');
            const [foodFat, setFoodFat] = useState('');

            // Real-time clock
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 60000);
                return () => clearInterval(timer);
            }, []);

            // Load data on mount
            useEffect(() => {
                try {
                    const savedUser = localStorage.getItem('fittrack_user');
                    const savedProfile = localStorage.getItem('fittrack_profile');
                    if (savedUser && savedProfile) {
                        setUser(JSON.parse(savedUser));
                        setProfile(JSON.parse(savedProfile));
                        setScreen('app');
                    }
                    loadDailyData(date);
                    loadWeightHistory();
                } catch (e) {}
            }, []);

            useEffect(() => {
                if (screen === 'app') loadDailyData(date);
            }, [date]);

            const loadDailyData = (d) => {
                try {
                    const e = localStorage.getItem(`ft_entries_${d}`);
                    setEntries(e ? JSON.parse(e) : []);
                    const w = localStorage.getItem(`ft_water_${d}`);
                    setWater(w ? parseInt(w) : 0);
                    const s = localStorage.getItem(`ft_steps_${d}`);
                    setSteps(s ? parseInt(s) : Math.floor(Math.random() * 5000) + 3000);
                    const wo = localStorage.getItem(`ft_workouts_${d}`);
                    setWorkouts(wo ? JSON.parse(wo) : []);
                } catch (e) {}
            };

            const loadWeightHistory = () => {
                const w = localStorage.getItem('ft_weight_history');
                setWeight(w ? JSON.parse(w) : []);
            };

            const saveEntries = (e) => {
                localStorage.setItem(`ft_entries_${date}`, JSON.stringify(e));
                setEntries(e);
            };

            const saveWater = (w) => {
                localStorage.setItem(`ft_water_${date}`, w);
                setWater(w);
            };

            const saveSteps = (s) => {
                localStorage.setItem(`ft_steps_${date}`, s);
                setSteps(s);
            };

            const saveWorkouts = (w) => {
                localStorage.setItem(`ft_workouts_${date}`, JSON.stringify(w));
                setWorkouts(w);
            };

            const getGreeting = () => {
                const hour = currentTime.getHours();
                if (hour < 12) return 'Good morning';
                if (hour < 18) return 'Good afternoon';
                return 'Good evening';
            };

            const getGreetingEmoji = () => {
                const hour = currentTime.getHours();
                if (hour < 12) return '🌅';
                if (hour < 18) return '☀️';
                return '🌙';
            };

            const calcMacros = (w, h, a, g, gt) => {
                let bmr = g === 'male' ? 10 * w + 6.25 * h - 5 * a + 5 : 10 * w + 6.25 * h - 5 * a - 161;
                const act = { sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725, veryactive: 1.9 };
                const tdee = bmr * (act[a] || 1.55);
                let cal = gt === 'leaner' ? Math.round(tdee * 0.85) : gt === 'shredded' ? Math.round(tdee * 0.78) : gt === 'stronger' ? Math.round(tdee * 1.1) : Math.round(tdee);
                let pr, ca, fa;
                if (gt === 'stronger') { pr = 0.3; ca = 0.5; fa = 0.2; }
                else if (gt === 'leaner' || gt === 'shredded') { pr = 0.4; ca = 0.35; fa = 0.25; }
                else { pr = 0.3; ca = 0.45; fa = 0.25; }
                return {
                    calories: cal,
                    protein: Math.round((cal * pr) / 4),
                    carbs: Math.round((cal * ca) / 4),
                    fat: Math.round((cal * fa) / 9),
                    bmr: Math.round(bmr),
                    tdee: Math.round(tdee)
                };
            };

            const completeSetup = () => {
                if (!setupAge || !setupWeight || !setupHeight || !setupGoal || !setupName) {
                    alert('Please fill all fields');
                    return;
                }
                const macros = calcMacros(parseFloat(setupWeight), parseFloat(setupHeight), parseFloat(setupAge), setupGender, setupGoalType);
                const newUser = { name: setupName, email: setupName.toLowerCase() + '@fittrack.com' };
                const newProfile = {
                    name: setupName,
                    age: parseFloat(setupAge),
                    weight: parseFloat(setupWeight),
                    height: parseFloat(setupHeight),
                    goal: parseFloat(setupGoal),
                    goalType: setupGoalType,
                    gender: setupGender,
                    activity: setupActivity,
                    ...macros,
                    startWeight: parseFloat(setupWeight),
                    startDate: new Date().toISOString(),
                    waterGoal: 8
                };
                localStorage.setItem('fittrack_user', JSON.stringify(newUser));
                localStorage.setItem('fittrack_profile', JSON.stringify(newProfile));
                
                // Save initial weight
                const initialWeight = [{ date: new Date().toISOString(), weight: parseFloat(setupWeight) }];
                localStorage.setItem('ft_weight_history', JSON.stringify(initialWeight));
                setWeight(initialWeight);
                
                setUser(newUser);
                setProfile(newProfile);
                setScreen('app');
                showNotif(`Welcome aboard, ${setupName}! 🎉`);
            };

            const showNotif = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(''), 3000);
            };

            const addFoodEntry = (name, cal, prot, carb, fat) => {
                const entry = {
                    id: Date.now(),
                    name,
                    calories: cal,
                    protein: prot,
                    carbs: carb,
                    fat: fat,
                    time: currentTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    timestamp: Date.now()
                };
                saveEntries([...entries, entry]);
                showNotif(`Added ${name}`);
            };

            const addManualFood = () => {
                if (!foodName || !foodCal) {
                    alert('Enter at least food name and calories!');
                    return;
                }
                addFoodEntry(foodName, parseFloat(foodCal), parseFloat(foodProtein) || 0, parseFloat(foodCarbs) || 0, parseFloat(foodFat) || 0);
                setFoodName(''); setFoodCal(''); setFoodProtein(''); setFoodCarbs(''); setFoodFat('');
                setShowAddFood(false);
            };

            const deleteFoodEntry = (id) => {
                saveEntries(entries.filter(e => e.id !== id));
            };

            const analyzePhoto = async (file) => {
                setAnalyzing(true);
                try {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        const base64 = e.target.result.split(',')[1];
                        try {
                            const response = await fetch("https://api.anthropic.com/v1/messages", {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    model: "claude-sonnet-4-20250514",
                                    max_tokens: 300,
                                    messages: [{
                                        role: "user",
                                        content: [
                                            { type: "image", source: { type: "base64", media_type: "image/jpeg", data: base64 } },
                                            { type: "text", text: "Analyze this food. Return ONLY JSON: {\"foodName\": \"name\", \"calories\": number, \"protein\": number, \"carbs\": number, \"fat\": number}" }
                                        ]
                                    }]
                                })
                            });
                            const data = await response.json();
                            const text = data.content?.[0]?.text;
                            if (text) {
                                const parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
                                addFoodEntry(parsed.foodName, parsed.calories, parsed.protein, parsed.carbs, parsed.fat);
                                setShowAddFood(false);
                            }
                        } catch (e) {
                            showNotif('Could not analyze photo');
                        }
                        setAnalyzing(false);
                    };
                    reader.readAsDataURL(file);
                } catch (e) {
                    setAnalyzing(false);
                }
            };

            const logout = () => {
                if (confirm('Are you sure you want to log out?')) {
                    localStorage.clear();
                    window.location.reload();
                }
            };

            const addWorkout = (name, cal, duration) => {
                const w = { id: Date.now(), name, calories: cal, duration, time: currentTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) };
                saveWorkouts([...workouts, w]);
                showNotif(`Added ${name}`);
            };

            const updateWeight = () => {
                const newWeight = prompt('Enter your current weight (kg):');
                if (newWeight && !isNaN(newWeight)) {
                    const updated = [...weight, { date: new Date().toISOString(), weight: parseFloat(newWeight) }];
                    localStorage.setItem('ft_weight_history', JSON.stringify(updated));
                    setWeight(updated);
                    
                    // Update profile
                    const newProfile = { ...profile, weight: parseFloat(newWeight) };
                    localStorage.setItem('fittrack_profile', JSON.stringify(newProfile));
                    setProfile(newProfile);
                    showNotif('Weight updated!');
                }
            };

            // LOGIN SCREEN
            if (screen === 'login') {
                return (
                    <div style={{ minHeight: '100vh', background: 'linear-gradient(180deg, #000 0%, #1a1a1a 100%)', display: 'flex', flexDirection: 'column', justifyContent: 'center', padding: '24px' }} className="slide-up">
                        <div style={{ textAlign: 'center', marginBottom: '40px' }}>
                            <div style={{ fontSize: '64px', marginBottom: '16px' }}>🍎</div>
                            <h1 style={{ color: 'white', fontSize: '36px', fontWeight: '800', marginBottom: '8px', letterSpacing: '-1px' }}>FitTrack</h1>
                            <p style={{ color: 'rgba(255,255,255,0.7)', fontSize: '16px' }}>Your Personal Nutrition Coach</p>
                        </div>

                        <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', marginBottom: '24px' }}>
                            <button onClick={() => setScreen('setup')} style={{ background: 'white', color: '#000', border: 'none', padding: '16px', borderRadius: '14px', fontWeight: '600', fontSize: '15px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '10px' }}>
                                <span style={{ fontSize: '20px' }}>🍎</span> Continue with Apple
                            </button>
                            <button onClick={() => setScreen('setup')} style={{ background: 'white', color: '#000', border: 'none', padding: '16px', borderRadius: '14px', fontWeight: '600', fontSize: '15px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '10px' }}>
                                <span style={{ fontSize: '20px' }}>🔵</span> Continue with Google
                            </button>
                            <button onClick={() => setScreen('setup')} style={{ background: 'rgba(255,255,255,0.15)', color: 'white', border: '1px solid rgba(255,255,255,0.2)', padding: '16px', borderRadius: '14px', fontWeight: '600', fontSize: '15px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '10px' }}>
                                <span style={{ fontSize: '20px' }}>📧</span> Continue with Email
                            </button>
                        </div>

                        <p style={{ textAlign: 'center', color: 'rgba(255,255,255,0.5)', fontSize: '12px' }}>
                            By continuing, you agree to our Terms & Privacy
                        </p>
                    </div>
                );
            }

            // SETUP SCREEN
            if (screen === 'setup') {
                const steps_setup = [
                    {
                        title: "What's your name?",
                        subtitle: "Let's personalize your experience",
                        content: (
                            <input type="text" value={setupName} onChange={(e) => setSetupName(e.target.value)} placeholder="Enter your name" className="input-field" style={{ fontSize: '18px', textAlign: 'center' }} />
                        )
                    },
                    {
                        title: "Tell us about you",
                        subtitle: "We'll calculate your perfect plan",
                        content: (
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                                    <input type="number" value={setupAge} onChange={(e) => setSetupAge(e.target.value)} placeholder="Age" className="input-field" />
                                    <select value={setupGender} onChange={(e) => setSetupGender(e.target.value)} className="input-field">
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                    </select>
                                </div>
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                                    <input type="number" value={setupWeight} onChange={(e) => setSetupWeight(e.target.value)} placeholder="Weight (kg)" className="input-field" />
                                    <input type="number" value={setupHeight} onChange={(e) => setSetupHeight(e.target.value)} placeholder="Height (cm)" className="input-field" />
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "What's your goal?",
                        subtitle: "Choose what matters most to you",
                        content: (
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                                <input type="number" value={setupGoal} onChange={(e) => setSetupGoal(e.target.value)} placeholder="Goal weight (kg)" className="input-field" />
                                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                                    {[
                                        { id: 'leaner', label: '💪 Leaner', desc: 'Lose fat' },
                                        { id: 'shredded', label: '🔥 Shredded', desc: 'Get cut' },
                                        { id: 'stronger', label: '🏋️ Stronger', desc: 'Build muscle' },
                                        { id: 'maintain', label: '⚖️ Maintain', desc: 'Stay fit' }
                                    ].map(opt => (
                                        <button key={opt.id} onClick={() => setSetupGoalType(opt.id)} style={{
                                            padding: '20px 12px',
                                            background: setupGoalType === opt.id ? '#000' : 'white',
                                            color: setupGoalType === opt.id ? 'white' : '#000',
                                            border: setupGoalType === opt.id ? 'none' : '1px solid #e5e5e7',
                                            borderRadius: '14px',
                                            fontWeight: '600',
                                            fontSize: '14px',
                                            textAlign: 'center'
                                        }}>
                                            <div style={{ fontSize: '18px', marginBottom: '4px' }}>{opt.label}</div>
                                            <div style={{ fontSize: '11px', opacity: 0.7 }}>{opt.desc}</div>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )
                    },
                    {
                        title: "Activity level?",
                        subtitle: "Help us calculate accurate calories",
                        content: (
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                                {[
                                    { id: 'sedentary', label: 'Sedentary', desc: 'Office job, no exercise' },
                                    { id: 'light', label: 'Light', desc: '1-3 days/week exercise' },
                                    { id: 'moderate', label: 'Moderate', desc: '3-5 days/week' },
                                    { id: 'active', label: 'Active', desc: '6-7 days/week' },
                                    { id: 'veryactive', label: 'Very Active', desc: 'Twice daily' }
                                ].map(opt => (
                                    <button key={opt.id} onClick={() => setSetupActivity(opt.id)} style={{
                                        padding: '16px',
                                        background: setupActivity === opt.id ? '#000' : 'white',
                                        color: setupActivity === opt.id ? 'white' : '#000',
                                        border: setupActivity === opt.id ? 'none' : '1px solid #e5e5e7',
                                        borderRadius: '14px',
                                        fontWeight: '600',
                                        textAlign: 'left',
                                        display: 'flex',
                                        justifyContent: 'space-between',
                                        alignItems: 'center'
                                    }}>
                                        <div>
                                            <div style={{ fontSize: '15px' }}>{opt.label}</div>
                                            <div style={{ fontSize: '12px', opacity: 0.7, marginTop: '2px' }}>{opt.desc}</div>
                                        </div>
                                        {setupActivity === opt.id && <span>✓</span>}
                                    </button>
                                ))}
                            </div>
                        )
                    }
                ];

                const current = steps_setup[setupStep];
                const canProceed = setupStep === 0 ? setupName : setupStep === 1 ? (setupAge && setupWeight && setupHeight) : true;

                return (
                    <div style={{ minHeight: '100vh', background: 'white', display: 'flex', flexDirection: 'column', padding: '24px' }} className="slide-up">
                        {/* Progress bar */}
                        <div style={{ display: 'flex', gap: '6px', marginBottom: '32px', marginTop: '20px' }}>
                            {steps_setup.map((_, i) => (
                                <div key={i} style={{ flex: 1, height: '4px', borderRadius: '2px', background: i <= setupStep ? '#000' : '#e5e5e7' }} />
                            ))}
                        </div>

                        <div style={{ marginBottom: '32px' }}>
                            <h2 style={{ fontSize: '28px', fontWeight: '800', marginBottom: '8px', letterSpacing: '-0.5px' }}>{current.title}</h2>
                            <p style={{ color: '#666', fontSize: '15px' }}>{current.subtitle}</p>
                        </div>

                        <div style={{ flex: 1 }}>
                            {current.content}
                        </div>

                        <div style={{ display: 'flex', gap: '10px', marginTop: '24px' }}>
                            {setupStep > 0 && (
                                <button onClick={() => setSetupStep(setupStep - 1)} className="btn-secondary" style={{ flex: 1 }}>
                                    Back
                                </button>
                            )}
                            <button 
                                onClick={() => setupStep < steps_setup.length - 1 ? setSetupStep(setupStep + 1) : completeSetup()} 
                                disabled={!canProceed}
                                style={{ flex: 2, background: canProceed ? '#000' : '#ccc', color: 'white', border: 'none', padding: '16px', borderRadius: '14px', fontWeight: '600', fontSize: '15px' }}>
                                {setupStep < steps_setup.length - 1 ? 'Continue →' : 'Start My Journey ✨'}
                            </button>
                        </div>
                    </div>
                );
            }

            // MAIN APP
            const totals = {
                calories: entries.reduce((s, e) => s + e.calories, 0),
                protein: entries.reduce((s, e) => s + e.protein, 0),
                carbs: entries.reduce((s, e) => s + e.carbs, 0),
                fat: entries.reduce((s, e) => s + e.fat, 0),
            };

            const burned = workouts.reduce((s, w) => s + w.calories, 0) + Math.round(steps * 0.04);

            const getWeekDates = () => {
                const today = new Date();
                const dayOfWeek = today.getDay();
                const week = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(today);
                    d.setDate(today.getDate() - dayOfWeek + i);
                    week.push(d);
                }
                return week;
            };

            const weekDates = getWeekDates();
            const dayNames = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];

            const foodSuggestions = [
                { name: 'Grilled Chicken (150g)', cal: 250, p: 47, c: 0, f: 5, icon: '🍗' },
                { name: 'Salmon Filet (120g)', cal: 240, p: 26, c: 0, f: 14, icon: '🐟' },
                { name: 'Egg Whites (3)', cal: 51, p: 11, c: 1, f: 0, icon: '🥚' },
                { name: 'Greek Yogurt (200g)', cal: 130, p: 23, c: 9, f: 2, icon: '🥛' },
                { name: 'Brown Rice (1 cup)', cal: 215, p: 5, c: 45, f: 2, icon: '🍚' },
                { name: 'Sweet Potato (150g)', cal: 130, p: 2, c: 30, f: 0, icon: '🍠' },
                { name: 'Avocado (half)', cal: 160, p: 2, c: 8, f: 15, icon: '🥑' },
                { name: 'Almonds (30g)', cal: 165, p: 6, c: 6, f: 14, icon: '🌰' },
                { name: 'Banana', cal: 105, p: 1, c: 27, f: 0, icon: '🍌' },
                { name: 'Broccoli (2 cups)', cal: 70, p: 8, c: 14, f: 1, icon: '🥦' },
            ];

            const workoutList = [
                { name: 'Push-ups', cal: 150, duration: 15, icon: '💪', intensity: 'Medium' },
                { name: 'Running', cal: 300, duration: 30, icon: '🏃', intensity: 'High' },
                { name: 'Squats', cal: 200, duration: 20, icon: '🦵', intensity: 'High' },
                { name: 'Yoga', cal: 100, duration: 30, icon: '🧘', intensity: 'Low' },
                { name: 'Cycling', cal: 320, duration: 45, icon: '🚴', intensity: 'Medium' },
                { name: 'HIIT Training', cal: 300, duration: 20, icon: '⚡', intensity: 'V. High' },
                { name: 'Swimming', cal: 280, duration: 30, icon: '🏊', intensity: 'High' },
                { name: 'Weight Lifting', cal: 250, duration: 45, icon: '🏋️', intensity: 'High' },
            ];

            return (
                <div style={{ minHeight: '100vh', paddingBottom: '90px', background: '#f5f5f7' }}>
                    {/* Notification */}
                    {notification && (

                                </div>
                                <button onClick={addManualFood} className="btn-primary" style={{ marginBottom: '10px' }}>Add Food</button>
                                <button onClick={() => setShowAddFood(false)} className="btn-secondary">Cancel</button>
                            </div>
                        </div>
                    )}

                    {/* Bottom Navigation */}
                    <div style={{ position: 'fixed', bottom: 0, left: 0, right: 0, background: 'white', borderTop: '1px solid #e5e5e7', padding: '8px 0 20px', display: 'flex', justifyContent: 'space-around', zIndex: 100 }}>
                        {[
                            { id: 'home', icon: '🏠', label: 'Home' },
                            { id: 'food', icon: '🍽️', label: 'Food' },
                            { id: 'workout', icon: '💪', label: 'Workout' },
                            { id: 'journey', icon: '🎯', label: 'Journey' },
                            { id: 'settings', icon: '⚙️', label: 'Settings' }
                        ].map(t => (
                            <button key={t.id} onClick={() => setTab(t.id)} style={{ background: 'none', border: 'none', padding: '8px 6px', flex: 1, textAlign: 'center', cursor: 'pointer', opacity: tab === t.id ? 1 : 0.4 }}>
                                <div style={{ fontSize: '22px', marginBottom: '2px' }}>{t.icon}</div>
                                <div style={{ fontSize: '10px', fontWeight: '600' }}>{t.label}</div>
                            </button>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
